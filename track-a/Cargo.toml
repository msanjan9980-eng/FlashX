[package]
name = "ingest"
version = "0.1.0"
edition = "2024"

# Zero crates: every dependency costs x0.90 on K (the D axis).
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Local perf/samply builds only; never the scored image.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Offsets, ids and counts are narrowed on purpose: the input is under 4 GiB with under 2^32 lines.
cast_possible_truncation = "allow"
# `intern` runs once per line and is forced inline: as a call it cost about 1 ms.
inline_always = "allow"
# `sort_network` imports the AVX2 intrinsics it uses, twelve of them, with a wildcard.
wildcard_imports = "allow"
# `sort_network` turns group sizes and lane positions, all below 65, into i32 lanes.
cast_possible_wrap = "allow"
