# alderlake = Raptor Lake's feature set (AVX2, BMI2, PCLMULQDQ). Never `native`: the board builds
# on a different host (Depot, AVX-512) and `native` reroutes builds to the box's E-cores.
# crt-static: a static binary skips the dynamic loader, which took about 0.25 ms of start-up.
# relocation-model=static: a plain static executable, not a static PIE (PERF.md, step 27).
[build]
rustflags = ["-C", "target-cpu=alderlake", "-C", "target-feature=+crt-static", "-C", "relocation-model=static"]
